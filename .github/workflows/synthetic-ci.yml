name: Public synthetic checks only

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout this PUBLIC repository only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run public fake-fixture tests (no private project source)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          python3 --version
          python3 -m unittest discover -s tests -p 'test_*.py' -v
